<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация</title>
  <style>
    body.dark-theme {
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.8rem; }
    form input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 1rem;
      border: none;
      border-radius: 8px;
      background: #2b2b2b;
      color: #fff;
      font-size: 1rem;
    }
    form input:focus {
      outline: 2px solid #4f46e5;
      background: #333;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    button:hover { background: #6366f1; }
    #message {
      margin-top: 1rem;
      font-size: 0.9rem;
      height: 1.2rem;
    }
  </style>
</head>
<body class="dark-theme">
<div class="container">
  <h1>Регистрация</h1>
  <form id="registerForm" autocomplete="off" novalidate>
    <input type="text" id="name" placeholder="Имя" required />
    <input type="email" id="email" placeholder="Почта" required />
    <input type="password" id="password" placeholder="Пароль" required />
    <button type="submit">Зарегистрироваться</button>
    <p id="message"></p>
  </form>
</div>

<script>
  document.getElementById('registerForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const form = e.target;
    const submitBtn = form.querySelector('button[type="submit"]');
    const resultDiv = document.getElementById('result');

    // Блокируем кнопку и меняем текст
    submitBtn.disabled = true;
    submitBtn.textContent = 'Обработка...';

    const payload = {
      name: form.name.value,
      email: form.email.value,
      password: form.password.value
    };

    try {
      const res = await fetch('register/api', {
        method: 'POST',
        credentials: 'include',              // чтобы установить куки сразу после регистрации
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();

      if (res.ok) {
        // Устанавливаем флаг и показываем успех
        localStorage.setItem('isLoggedIn', 'true');
        resultDiv.textContent = 'Регистрация удалась! Перенаправляю...';
        resultDiv.className = 'mt-4 text-center text-green-600';

        // Убираем форму
        form.remove();

        setTimeout(() => {
          window.location.href = 'main.html';
        }, 800);

      } else if (res.status === 409) {
        // Email занят
        resultDiv.textContent = 'Этот email уже используется.';
        resultDiv.className = 'mt-4 text-center text-red-600';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';

      } else {
        // Другие ошибки
        resultDiv.textContent = 'Ошибка регистрации: ' + (data.message || res.status);
        resultDiv.className = 'mt-4 text-center text-red-600';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Зарегистрироваться';
      }

    } catch (err) {
      resultDiv.textContent = 'Сервер недоступен.';
      resultDiv.className = 'mt-4 text-center text-red-600';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Зарегистрироваться';
      console.error(err);
    }
  });
</script>
</script>
</body>
</html>
