<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Регистрация</title>
  <style>
    * { box-sizing: border-box; }
    body.dark-theme {
      background: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 1rem;
    }
    .container {
      background: #1e1e1e; padding: 2rem; border-radius: 16px;
      box-shadow: 0 0 20px rgba(255,255,255,.05); width: 100%; max-width: 380px; text-align: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.8rem; }
    form input {
      width: 100%; padding: 12px 16px; margin-bottom: 1rem; border: none; border-radius: 8px;
      background: #2b2b2b; color: #fff; font-size: 1rem;
    }
    form input:focus { outline: 2px solid #4f46e5; background: #333; }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #4f46e5; color: #fff; font-size: 1rem; cursor: pointer; transition: background .3s;
    }
    button:hover { background: #6366f1; }
    #message { margin-top: 1rem; font-size: .9rem; min-height: 1.2рем; }
    /* Подсветка ошибок */
    input.error { outline: 2px solid #ff6b6b !important; background: #302424; }
    @media (max-width: 400px) {
      h1 { font-size: 1.5rem; }
      .container { padding: 1.5rem 1rem; border-radius: 12px; }
      form input, button { font-size: .95rem; padding: 10px 14px; }
    }
  </style>
</head>
<body class="dark-theme">
<div class="container">
  <h1>Регистрация</h1>
  <form id="registerForm" autocomplete="off" novalidate>
    <input type="text" id="name" name="name" placeholder="Имя" required />
    <input type="email" id="email" name="email" placeholder="Почта" required />
    <input type="password" id="password" name="password" placeholder="Пароль" required />
    <button type="submit">Зарегистрироваться</button>
    <p id="message"></p>
  </form>
</div>

<script>
  const form = document.getElementById('registerForm');
  const nameInput = document.getElementById('name');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const message = document.getElementById('message');

  function setFieldError(input, text) {
    input.classList.add('error');
    message.textContent = text;
    message.style.color = '#ff6b6b';
  }
  function clearFieldError(input) {
    input.classList.remove('error');
  }
  // Снимать подсветку при вводе
  [nameInput, emailInput, passwordInput].forEach(el => {
    el.addEventListener('input', () => clearFieldError(el));
  });

  function looksLikeEmail(text) {
    return /@/.test(text) || /gmail/i.test(text) || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(text);
  }
  function validEmail(text) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(text);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const submitBtn = form.querySelector('button[type="submit"]');
    message.textContent = '';

    // Сброс прошлых ошибок
    clearFieldError(nameInput);
    clearFieldError(emailInput);

    const name = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Валидация имени: обязательно и не должно выглядеть как email
    if (!name || looksLikeEmail(name)) {
      setFieldError(nameInput, 'Пожалуйста, введите имя');
      return;
    }

    // Валидация почты: обязательна и должна быть корректной
    if (!validEmail(email)) {
      setFieldError(emailInput, 'Пожалуйста, введите почту');
      return;
    }

    // Если всё ок — отправляем
    submitBtn.disabled = true;
    submitBtn.textContent = 'Обработка...';

    const payload = { name, email, password };

    try {
      const res = await fetch('/register/api', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      // Надежно извлекаем сообщение об ошибке: JSON или текст
      let data = null;
      let rawText = '';
      try {
        data = await res.json();
      } catch (_) {
        try {
          rawText = await res.text();
          // попытка распарсить на случай, если пришла строка JSON
          try { data = JSON.parse(rawText); } catch (_) {}
        } catch (_) {}
      }

      if (res.ok) {
        localStorage.setItem('isLoggedIn', 'true');
        message.textContent = 'Регистрация удалась! Перенаправляю...';
        message.style.color = 'lightgreen';
        window.location.href = '/main';
        form.remove();
        return;
      }

      const serverMsg = (data && (data.message || data.error || data.detail)) || rawText || '';

      // Если сервер прислал "person already exists" — показываем, что email уже используется
      const emailExists =
              res.status === 409 ||
              /person already exists/i.test(serverMsg) ||
              /already exists/i.test(serverMsg);

      if (emailExists) {
        setFieldError(emailInput, 'Этот email уже используется.');
        return;
      }

      message.textContent = 'Ошибка регистрации: ' + (serverMsg || res.status);
      message.style.color = '#ff6b6b';
    } catch (err) {
      console.error(err);
      message.textContent = 'Сервер недоступен.';
      message.style.color = '#ff6b6b';
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Зарегистрироваться';
    }
  });
</script>
</body>
</html>
