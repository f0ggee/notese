<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Вход</title>
  <style>
    body.dark-theme {
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .container {
      background: #1e1e1e;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
      width: 100%;
      max-width: 350px;
      text-align: center;
    }
    h1 { margin-bottom: 1.5rem; font-size: 1.8rem; }
    form input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 1rem;
      border: none;
      border-radius: 8px;
      background: #2b2b2b;
      color: #fff;
      font-size: 1rem;
    }
    form input:focus {
      outline: 2px solid #4f46e5;
      background: #333;
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .btn-group button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }
    .btn-group button:hover {
      background: #6366f1;
    }
    #message {
      margin-top: 1rem;
      color: #ff6b6b;
      font-size: 0.9rem;
      height: 1.2rem;
    }
  </style>
</head>
<body class="dark-theme">
<div class="container">
  <h1>Добро пожаловать</h1>
  <form id="loginForm" autocomplete="off" novalidate>
    <input type="email" id="email" placeholder="Введите вашу почту" required />
    <input type="password" id="password" placeholder="Пароль" required />
    <div class="btn-group">
      <button type="submit">Войти</button>
      <button type="button" onclick="window.location.href='register.html'">Регистрация</button>
    </div>
    <p id="message"></p>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const message = document.getElementById('message');

    if (!email || !password) {
      message.textContent = 'Введите почту и пароль';
      return;
    }

    try {
      const res = await fetch('/login/api', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        localStorage.setItem('username', email);
        localStorage.setItem('isLoggedIn', 'true');
        window.location.href = 'main.html';
      } else {
        message.textContent = data.message || 'Ошибка авторизации';
      }
    } catch {
      message.textContent = 'Сервер не отвечает';
    }
  });
</script>
</body>
</html>
