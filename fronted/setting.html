<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Настройки</title>
  <style>
    body.dark-theme {
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1e1e1e;
      padding: 1rem 2rem;
      box-shadow: 0 0 10px rgba(255,255,255,0.05);
    }
    .username {
      font-size: 1rem;
    }
    .logout-btn, .settings-btn, .option-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }
    .logout-btn:hover, .settings-btn:hover, .option-btn:hover {
      background: #6366f1;
    }
    main {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      justify-content: center;
      align-items: center;
      height: calc(100vh - 80px);
      text-align: center;
    }
    h1 {
      font-size: 2rem;
      margin: 0;
    }
  </style>
</head>
<body class="dark-theme">

<header>
  <div class="username" id="userName">Пользователь</div>
  <div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
  </div>
</header>

<main>
  <h1>Настройки</h1>
  <button class="option-btn" id="twofaBtn">Двухфакторная аутентификация</button>
</main>

<script>
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = '/login.html';
  }

  // Загрузка имени пользователя
  async function loadProfile() {
    try {
      const res = await fetch('/profile/api');
      if (!res.ok) throw new Error('Ошибка загрузки профиля');
      const data = await res.json();
      const name = data.name || 'Пользователь';
      document.getElementById('userName').textContent = `Привет, ${name}`;
    } catch (err) {
      console.error(err);
      document.getElementById('userName').textContent = 'Ошибка';
    }
  }
  loadProfile();

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('username');
    localStorage.removeItem('isLoggedIn');
    window.location.href = '/';
  });

  document.getElementById('twofaBtn').addEventListener('click', () => {
    window.location.href = '/two_check';
  });
</script>

</body>
</html>
