<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Добавить заметку</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body.dark-theme {
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 1.75rem;
    }

    form {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1rem;
      background-color: #1a1a1a;
      border-radius: 12px;
    }

    label {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    input, textarea {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background-color: #1e1e1e;
      color: #ffffff;
      font-size: 1rem;
    }

    input:focus, textarea:focus {
      outline: 2px solid #4f46e5;
    }

    textarea {
      resize: vertical;
      min-height: 150px;
    }

    button {
      align-self: flex-end;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background-color: #4f46e5;
      color: #ffffff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background-color: #6366f1;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 1.4rem;
      }

      form {
        padding: 1rem 0.5rem;
        border-radius: 8px;
      }

      button {
        width: 100%;
        align-self: center;
      }
    }
  </style>
</head>
<body class="dark-theme">

<h1>Добавить новую заметку</h1>

<form id="noteForm">
  <div>
    <label for="title">Заголовок</label>
    <input type="text" id="title" name="title" required />
  </div>

  <div>
    <label for="data">Дата и время</label>
    <input type="datetime-local" id="data" name="data" required />
  </div>

  <div>
    <label for="content">Текст заметки</label>
    <textarea id="content" name="content" required></textarea>
  </div>

  <button type="submit">Сохранить</button>
</form>

<script>
  document.getElementById('noteForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const note = {
      title: document.getElementById('title').value,
      data: document.getElementById('data').value,
      content: document.getElementById('content').value,
    };

    try {
      const response = await fetch('/addnotes/api', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(note)
      });

      if (response.status === 401) {
        alert('Сессия истекла. Пожалуйста, войдите снова.');
        localStorage.removeItem('username');
        localStorage.removeItem('isLoggedIn');
        window.location.href = '/login.html';
        return;
      }

      if (!response.ok) {
        throw new Error('Ошибка при отправке: ' + response.statusText);
      }

      const result = await response.json();
      alert('Заметка успешно добавлена!');
      window.location.href = '/main';

    } catch (err) {
      console.error('Ошибка:', err);
      alert('Не удалось добавить заметку');
    }
  });
</script>

</body>
</html>
