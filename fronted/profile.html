<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профиль</title>
  <style>
    * { box-sizing: border-box; }

    /* Базовая раскладка: значения берутся из CSS-переменных темы */
    body {
      margin: 0; padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    /* Тема black */
    body.black {
      --bg: #121212;
      --text: #ffffff;
      --header-bg: #1e1e1e;
      --card-bg: #1e1e1e;
      --border: #444444;
      --muted: #bbbbbb;
      --shadow: rgba(255,255,255,0.05);
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --btn-text: #ffffff;
    }

    /* Тема white */
    body.white {
      --bg: #f5f5f7;
      --text: #111111;
      --header-bg: #ffffff;
      --card-bg: #ffffff;
      --border: #e1e1e6;
      --muted: #6b7280;
      --shadow: rgba(0,0,0,0.07);
      --accent: #4f46e5;
      --accent-hover: #6366f1;
      --btn-text: #ffffff;
    }

    header {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;
      background: var(--header-bg); padding: 1rem 2rem; box-shadow: 0 0 10px var(--shadow);
    }
    .username { font-size: 1rem; margin-bottom: 0.5rem; }

    header > div:last-child { display: flex; flex-wrap: wrap; gap: 0.5rem; }

    .logout-btn, .settings-btn {
      padding: 8px 16px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--btn-text); font-size: 0.9rem; cursor: pointer; transition: background 0.3s ease;
    }
    .logout-btn:hover, .settings-btn:hover { background: var(--accent-hover); }

    main { display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
    h1 { font-size: 2rem; margin-bottom: 2rem; text-align: center; }

    .notes-container { display: flex; flex-direction: column; gap: 1rem; width: 100%; max-width: 700px; }

    .note-card {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px;
      padding: 1rem; position: relative; word-wrap: break-word;
    }
    .note-title { font-size: 1.2rem; margin-bottom: 0.5rem; font-weight: 600; }
    .note-time { position: absolute; top: 1rem; right: 1rem; font-size: 0.85rem; color: var(--muted); }
    .note-content { margin-top: 2rem; font-size: 1rem; line-height: 1.5; white-space: pre-wrap; }

    @media (max-width: 600px) {
      header { flex-direction: column; align-items: flex-start; padding: 1rem; }
      .username { font-size: 1rem; margin-bottom: 0.5rem; }
      header > div:last-child { width: 100%; justify-content: flex-start; }
      .logout-btn, .settings-btn { flex: 1 1 auto; font-size: 0.85rem; padding: 10px 12px; }
      h1 { font-size: 1.6rem; }
      .note-title { font-size: 1.1rem; }
      .note-time { position: static; text-align: right; margin-top: 0.5rem; }
      .note-card { padding: 1rem 0.75rem; }
    }
  </style>
</head>
<body class="black">
<header>
  <div class="username" id="userName">Привет, пользователь</div>
  <div>
    <button class="logout-btn" id="logoutBtn">Выйти</button>
    <button class="settings-btn" id="settingsBtn">Настройки</button>
  </div>
</header>

<main>
  <h1>Ваши заметки</h1>
  <div class="notes-container" id="notesContainer"></div>
</main>

<script>
  // Если не авторизован — на главную
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.href = '/';
  }

  const userNameDiv = document.getElementById('userName');
  const logoutBtn = document.getElementById('logoutBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const notesContainer = document.getElementById('notesContainer');

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('username');
    localStorage.removeItem('isLoggedIn');
    window.location.href = '/';
  });

  if (settingsBtn) {
    settingsBtn.addEventListener('click', () => {
      window.location.href = '/setting';
    });
  }

  function handleUnauthorized() {
    alert('Сессия истекла. Пожалуйста, войдите снова.');
    localStorage.removeItem('username');
    localStorage.removeItem('isLoggedIn');
    window.location.href = '/';
  }

  // Применение темы напрямую: 'black' | 'white' => классы 'black' | 'white'
  function applyTheme(theme) {
    const t = (theme || '').toLowerCase();
    document.body.classList.remove('black', 'white');
    if (t === 'white') {
      document.body.classList.add('white');
    } else {
      document.body.classList.add('black');
    }
  }

  // Попытаться вытащить тему из профиля либо ручки /theme/api
  async function resolveThemeFromServer(profileData) {
    let themeCandidate = null;

    if (typeof profileData === 'string') {
      themeCandidate = profileData;              // "black" | "white"
    } else if (profileData && typeof profileData === 'object' && 'theme' in profileData) {
      themeCandidate = profileData.theme;        // { theme: "black" | "white" }
    }

    if (themeCandidate) {
      applyTheme(themeCandidate);
      return;
    }

    try {
      const tr = await fetch('/theme/api', { credentials: 'include' });
      if (tr.ok) {
        const tdata = await tr.json();
        const t = (typeof tdata === 'string') ? tdata : (tdata && tdata.theme);
        if (t) {
          applyTheme(t);
          return;
        }
      }
    } catch (e) {
      console.warn('Не удалось получить тему из /theme/api:', e);
    }

    // По умолчанию — black
    applyTheme('black');
  }

  async function loadProfile() {
    try {
      const res = await fetch('/profile/api', { credentials: 'include' });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (!res.ok) throw new Error('Ошибка загрузки профиля');

      const data = await res.json();

      // Установка темы на основе данных сервера
      resolveThemeFromServer(data);

      const name = (data && data.name) ? data.name : 'Пользователь';
      if (userNameDiv) {
        userNameDiv.textContent = `Привет, ${name}`;
      }

      if (Array.isArray(data?.notes)) {
        renderNotes(data.notes);
      }
    } catch (err) {
      console.error('Ошибка запроса к /profile/api:', err);
      if (userNameDiv) {
        userNameDiv.textContent = 'Ошибка загрузки имени';
      }
      applyTheme('black');
    }
  }

  function renderNotes(notes) {
    notesContainer.innerHTML = '';
    notes.forEach(note => {
      const card = document.createElement('div');
      card.className = 'note-card';

      const title = document.createElement('div');
      title.className = 'note-title';
      title.textContent = note.title || 'Без заголовка';

      const time = document.createElement('div');
      time.className = 'note-time';
      time.textContent = formatDateTime(note.date || note.createdAt);

      const content = document.createElement('div');
      content.className = 'note-content';
      content.textContent = note.content || '';

      card.appendChild(title);
      card.appendChild(time);
      card.appendChild(content);
      notesContainer.appendChild(card);
    });
  }

  function formatDateTime(dateStr) {
    const date = new Date(dateStr);
    if (isNaN(date)) return '';
    return date.toLocaleString('ru-RU', {
      day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit'
    });
  }

  loadProfile();
</script>
</body>
</html>
