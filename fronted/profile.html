<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Профиль</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); }
        body.black {
            --bg:#121212; --text:#ffffff; --header-bg:#1e1e1e; --card-bg:#1e1e1e; --border:#444444; --muted:#bbbbbb;
            --shadow:rgba(255,255,255,0.05); --accent:#4f46e5; --accent-hover:#6366f1; --btn-text:#ffffff;
        }
        body.white {
            --bg:#f5f5f7; --text:#111111; --header-bg:#ffffff; --card-bg:#ffffff; --border:#e1e1e6; --muted:#6b7280;
            --shadow:rgba(0,0,0,0.07); --accent:#4f46e5; --accent-hover:#6366f1; --btn-text:#ffffff;
        }
        header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; background:var(--header-bg); padding:1rem 2rem; box-shadow:0 0 10px var(--shadow); }
        .username { font-size:1rem; margin-bottom:0.5rem; }
        header > div:last-child { display:flex; flex-wrap:wrap; gap:0.5rem; }
        .btn { padding:8px 16px; border:none; border-radius:8px; background:var(--accent); color:var(--btn-text); font-size:0.9rem; cursor:pointer; transition:background .3s; }
        .btn:hover { background:var(--accent-hover); }
        main { display:flex; flex-direction:column; align-items:center; padding:2rem 1rem; }
        h1 { font-size:2rem; margin-bottom:2rem; text-align:center; }
        .notes-container { display:flex; flex-direction:column; gap:1rem; width:100%; max-width:700px; }
        .note-card { background:var(--card-bg); border:1px solid var(--border); border-radius:10px; padding:1rem; word-wrap:break-word; }
        .note-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; }
        .note-right { display:flex; align-items:center; gap:.5rem; flex-shrink:0; }
        .note-title { font-size:1.2rem; font-weight:600; }
        .note-time { font-size:.85rem; color:var(--muted); }
        .note-content { margin-top:1rem; font-size:1rem; line-height:1.5; white-space:pre-wrap; }
    </style>
</head>
<body class="black">
<header>
    <div class="username" id="userName">Привет, пользователь</div>
    <div>
        <button class="btn" id="logoutBtn">Выйти</button>
        <button class="btn" id="settingsBtn">Настройки</button>
    </div>
</header>

<main>
    <h1>Ваши заметки</h1>
    <div class="notes-container" id="notesContainer"></div>
</main>

<script>
    if (localStorage.getItem('isLoggedIn') !== 'true') window.location.href = '/';

    const userNameDiv = document.getElementById('userName');
    const logoutBtn = document.getElementById('logoutBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const notesContainer = document.getElementById('notesContainer');

    logoutBtn.addEventListener('click', () => {
        localStorage.removeItem('username');
        localStorage.removeItem('isLoggedIn');
        window.location.href = '/';
    });
    settingsBtn.addEventListener('click', () => window.location.href = '/setting');

    function handleUnauthorized() {
        alert('Сессия истекла. Пожалуйста, войдите снова.');
        localStorage.removeItem('username');
        localStorage.removeItem('isLoggedIn');
        window.location.href = '/';
    }

    function applyTheme(theme) {
        const t = (theme || '').toLowerCase();
        document.body.classList.remove('black','white');
        document.body.classList.add(t === 'white' ? 'white' : 'black');
    }

    function formatDateTime(dateStr) {
        const date = new Date(dateStr);
        if (isNaN(date)) return '';
        return date.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    }

    function stripTrailingBraces(s) {
        return String(s ?? '').replace(/}\s*$/g, '');
    }

    function normalizeServerText(raw) {
        const obj = { title:'', data:'', content:'' };
        const re = /\bTitle:(.*?)\s+Data:(.*?)\s+Content:(.*)$/s;
        const m = re.exec(raw || '');
        if (m) {
            obj.title = stripTrailingBraces(m[1].trim());
            obj.data = stripTrailingBraces(m[2].trim());
            obj.content = stripTrailingBraces(m[3].trim());
        }
        return obj;
    }

    function toReadable(note) {
        const dt = new Date(note.data || note.date || note.createdAt);
        const dateStr = isNaN(dt) ? stripTrailingBraces(note.data || '') : dt.toLocaleString('ru-RU', {
            day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
        });
        return { title: stripTrailingBraces(note.title || 'Без заголовка'), dateStr, content: stripTrailingBraces(note.content || '') };
    }

    function formatAsText(readable) {
        return `Заголовок: ${readable.title}\nДата: ${readable.dateStr}\n\n${readable.content}\n`;
    }

    function toIso(value) {
        if (!value) return '';
        const d = new Date(value);
        if (isNaN(d)) return String(value);
        return d.toISOString();
    }

    // --- отправка заметки строго в формате S3write ---
    async function sendNoteForDownload(note) {
        const payload = {
            title: String(note.title ?? ''),
            data: toIso(note.data ?? note.date ?? note.createdAt ?? ''),
            content: String(note.content ?? '')
        };

        try {
            const res = await fetch('/Download/api', {
                method:'POST',
                credentials:'include',
                headers:{
                    'Content-Type':'application/json',
                    'Accept':'application/octet-stream, application/json, text/plain'
                },
                body: JSON.stringify(payload)
            });

            if (res.status === 401) { handleUnauthorized(); return; }
            if (res.status === 302) { alert('Файл уже существует'); return; }
            if (res.status !== 200) throw new Error('Ошибка ответа сервера');

            const disp = res.headers.get('Content-Disposition') || res.headers.get('content-disposition');
            if (disp && /attachment/i.test(disp)) {
                let filename = 'download.bin';
                const m = /filename\*=UTF-8''([^;]+)|filename="?([^\";]+)"?/i.exec(disp);
                const raw = decodeURIComponent((m && (m[1] || m[2])) || '').trim();
                if (raw) filename = raw;

                const blob = await res.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename;
                document.body.appendChild(a); a.click(); a.remove();
                URL.revokeObjectURL(url);
                alert('Файл успешно скачан');
                return;
            }

            const ct = (res.headers.get('Content-Type') || '').toLowerCase();
            if (ct.includes('application/json')) {
                const obj = await res.json();
                alert(obj?.message ? String(obj.message) : 'Готово');
            } else {
                const text = await res.text();
                alert(text || 'Готово');
            }
        } catch (err) {
            console.error('Ошибка при отправке:', err);
            alert('Не удалось выполнить операцию.');
        }
    }

    async function loadProfile() {
        try {
            const res = await fetch('/profile/api', { credentials:'include' });
            if (res.status === 401) { handleUnauthorized(); return; }
            if (!res.ok) throw new Error('Ошибка загрузки профиля');

            const data = await res.json();
            const theme = (typeof data?.theme === 'string') ? data.theme : 'black';
            applyTheme(theme);
            const name = (data && data.name) ? data.name : 'Пользователь';
            if (userNameDiv) userNameDiv.textContent = `Привет, ${name}`;

            if (data?.notes) {
                renderNotes(Array.isArray(data.notes) ? data.notes : [data.notes]);
            }
        } catch (err) {
            console.error('Ошибка запроса к /profile/api:', err);
            if (userNameDiv) userNameDiv.textContent = 'Ошибка загрузки имени';
            applyTheme('black');
        }
    }

    function renderNotes(notes) {
        notesContainer.innerHTML = '';
        notes.forEach(note => {
            if (typeof note === 'string') note = normalizeServerText(note);
            const readable = toReadable(note);

            const card = document.createElement('div');
            card.className = 'note-card';

            const head = document.createElement('div');
            head.className = 'note-head';

            const title = document.createElement('div');
            title.className = 'note-title';
            title.textContent = readable.title;

            const right = document.createElement('div');
            right.className = 'note-right';

            const time = document.createElement('div');
            time.className = 'note-time';
            time.textContent = readable.dateStr;

            const dlBtn = document.createElement('button');
            dlBtn.className = 'btn';
            dlBtn.type = 'button';
            dlBtn.textContent = 'Скачать';
            dlBtn.addEventListener('click', () => sendNoteForDownload(note));

            right.appendChild(time);
            right.appendChild(dlBtn);

            head.appendChild(title);
            head.appendChild(right);

            const content = document.createElement('div');
            content.className = 'note-content';
            content.textContent = readable.content;

            card.appendChild(head);
            card.appendChild(content);
            notesContainer.appendChild(card);
        });
    }

    loadProfile();
</script>
</body>
</html>
