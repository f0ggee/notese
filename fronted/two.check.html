<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ввод email</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body.dark-theme {
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      background: #1e1e1e;
      padding: 1rem 2rem;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .username {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .logout-btn {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: #6366f1;
    }

    main {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      min-height: calc(100vh - 80px);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      margin: 0;
      text-transform: uppercase;
    }

    input[type="email"] {
      padding: 12px 16px;
      border-radius: 8px;
      border: none;
      width: 100%;
      max-width: 320px;
      font-size: 1rem;
      background: #2b2b2b;
      color: #fff;
    }

    input[type="email"]:focus {
      outline: 2px solid #4f46e5;
      background: #333;
    }

    .send-btn {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      max-width: 200px;
    }

    .send-btn:hover {
      background: #6366f1;
    }

    @media (max-width: 500px) {
      header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
      }

      .username {
        font-size: 0.95rem;
      }

      h1 {
        font-size: 1.6rem;
      }

      .send-btn {
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body class="dark-theme">
<header>
  <div class="username" id="userName">Пользователь</div>
  <div><button class="logout-btn" id="logoutBtn">Выйти</button></div>
</header>

<main>
  <h1>Введите email</h1>
  <input type="email" id="emailInput" placeholder="email@example.com" required />
  <button class="send-btn" id="sendBtn">Отправить</button>
</main>

<script>
  const API_BASE = '/secure/api';

  if (localStorage.getItem('isLoggedIn') !== 'true') {
    location.href = '/login.html';
  }

  (async () => {
    try {
      const res = await fetch(API_BASE, { method: 'GET' });
      if (res.ok) {
        const data = await res.json();
        document.getElementById('userName').textContent = `Привет, ${data.name || 'Пользователь'}`;

        if (data.twofaEnabled) {
          location.href = '/success';
        }
      } else {
        console.warn(`Сервер ответил статусом ${res.status}`);
      }
    } catch (e) {
      console.error('Ошибка получения профиля:', e);
    }
  })();

  document.getElementById('logoutBtn').onclick = () => {
    localStorage.removeItem('username');
    localStorage.removeItem('isLoggedIn');
    location.href = '/';
  };

  async function sendEmail() {
    const emailField = document.getElementById('emailInput');
    const email = emailField.value.trim();

    if (!/^\S+@\S+\.\S+$/.test(email)) {
      alert('Введите корректный e-mail');
      emailField.focus();
      return;
    }

    try {
      const res = await fetch(API_BASE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json().catch(() => ({}));

      if (res.ok) {
        if (data.twofaEnabled === true) {
          location.href = '/success';
        } else {
          location.href = '/set';
        }
      } else {
        alert(data.message || `Сервер ответил статусом ${res.status}`);
      }
    } catch (err) {
      console.error('Ошибка запроса:', err);
      alert('Сервер недоступен или сеть отключена.');
    }
  }

  document.getElementById('sendBtn').addEventListener('click', sendEmail);
  document.getElementById('emailInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendEmail();
  });
</script>
</body>
</html>
