<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Двухфакторная аутентификация включена</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body.dark-theme {
      background: #121212;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
      text-align: center;
    }

    .success {
      color: #4ade80; /* зелёный акцент */
      font-size: 1.8rem;
      margin-bottom: 2rem;
    }

    .profile-btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .profile-btn:hover {
      background: #6366f1;
    }

    @media (max-width: 480px) {
      .success {
        font-size: 1.5rem;
      }

      .profile-btn {
        width: 100%;
        max-width: 240px;
        font-size: 0.95rem;
        padding: 12px;
      }
    }
  </style>
</head>
<body class="dark-theme">
<div class="success">Двухфакторная&nbsp;аутентификация&nbsp;включена</div>
<a href="/profile">
  <button class="profile-btn">К&nbsp;профилю</button>
</a>
</body>
</html>
